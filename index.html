<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Emilien GIBEAUD">
  <meta name="description" content="Jeu permettant de faire travailler sa mémoire.">

  <link rel="shortcut icon" href="./Assets/icon/brain.svg" type="image/x-icon">
  <link rel="stylesheet" href="./Assets/style.css">
  
  <script src="./Assets/script.js" type="module"></script>
  <title>Memory Game</title>
</head>

<body>
  <div class="settings">
    <div class="input">
      <label for="horizontal">Cartes → (3≤n≤8)&nbsp:</label>
      <input type="number" id="horizontal" value="3" min="3" max="8" step="1">
    </div>

    <div class="input">
      <label for="vertical">Cartes ↓ (3≤n≤6)&nbsp:</label>
      <input type="number" id="vertical" value="4" min="3" max="6" step="1">
    </div>

    <input type="button" id="start" class="btn" value="Recharger">
  </div>
  <div id="game_board">
    <!-- Exemple de carte
      <div class="card" data-value="./Assets/icon/grasshopper.svg" data-id="carte 2">
        <img class="card_content" src="./Assets/icon/grasshopper.svg">
        <p class="name_en">grasshopper</p>
        <p class="name_fr">(sauterelle)</p>
      </div>
    -->
  </div>
</body>
</html>
